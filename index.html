<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電話查詢系統</title>
    <style>
        /* ========== CSS 樣式區 ========== */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 18px;
            /* 背景設定 */
            background-image: url('517.jpg'); 
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-color: #f0f0f0;
        }

        /* 手機版背景 */
        @media (max-width: 768px) {
            body {
                background-image: url('703.jpg');
                background-attachment: scroll;
            }
        }

        .container {
            max-width: 600px;
            margin: 40px auto 0;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        #searchInput {
            flex-grow: 1;
            padding: 12px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #searchButton {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #searchButton:hover {
            background-color: #0056b3;
        }

        #searchButton:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .system-remark {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
            text-align: right;
        }

        #resultsContainer {
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px 8px;
            text-align: left;
            font-size: 16px;
        }

        th {
            background-color: #f2f2f2;
            white-space: nowrap;
        }

        .message {
            text-align: center;
            padding: 10px;
            color: #555;
        }
        
        @media (max-width: 768px) {
            .container { margin: 20px 10px; }
            #searchInput, #searchButton { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>電話查詢小幫手</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="輸入姓名、單位或分機" />
            <button id="searchButton">查詢</button>
        </div>
        <div class="system-remark">* 僅供內部查詢使用</div>
        <div id="resultsContainer"></div>
    </div>

    <script>
        // ========== 設定區 ==========
        
        // 1. 請將這裡換成您剛剛部署得到的 Google Apps Script 網址
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxlseE37yzuF1n6nmUGsmDhnpOfx49vSYeWTByW0CNIKlRik1gGLBPlflrG21uJSWBP/exec';

        // 2. 本地資料 (如果讀不到 data.json，就會用這個)
        let localData = [
            { name: "測試員", unit: "資訊部", ext: "123", phone: "0900-000-000" }
        ];

        // 嘗試讀取 data.json
        fetch('data.json')
            .then(res => {
                if(res.ok) return res.json();
            })
            .then(data => {
                if(data) {
                    localData = data;
                    console.log('成功載入 data.json');
                }
            })
            .catch(err => console.log('使用預設資料'));


        // ========== 程式邏輯區 ==========

        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainer = document.getElementById('resultsContainer');

        // 獲取 IP (選擇性功能)
        async function getUserIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const json = await res.json();
                return json.ip;
            } catch (e) {
                return 'unknown';
            }
        }

        // 主功能：查詢 + 記錄
        async function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                alert('請輸入關鍵字');
                return;
            }

            // 鎖定按鈕避免重複按
            searchButton.disabled = true;
            searchButton.textContent = '查詢中...';
            resultsContainer.innerHTML = '<div class="message">搜尋中...</div>';

            try {
                // --- 步驟 A: 記錄到 Google Sheet ---
                const ip = await getUserIP();
                
                // 這裡使用 'no-cors' 模式，這是讓資料能成功寫入 Sheet 的關鍵
                // 雖然瀏覽器收不到「成功」的回應，但資料會送達
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: JSON.stringify({
                        keyword: keyword,
                        source: 'web',
                        userIP: ip,
                        userAgent: navigator.userAgent
                    })
                });

                // --- 步驟 B: 顯示搜尋結果 ---
                displayResults(keyword);

            } catch (error) {
                console.error('Error:', error);
                // 就算記錄失敗，也要顯示搜尋結果給使用者看
                displayResults(keyword);
            } finally {
                searchButton.disabled = false;
                searchButton.textContent = '查詢';
            }
        }

        function displayResults(keyword) {
            const lowerKey = keyword.toLowerCase();
            const results = localData.filter(item => 
                (item.name && item.name.toLowerCase().includes(lowerKey)) ||
                (item.unit && item.unit.toLowerCase().includes(lowerKey)) ||
                (item.ext && item.ext.includes(lowerKey))
            );

            if (results.length === 0) {
                resultsContainer.innerHTML = `<div class="message">找不到「${keyword}」。</div>`;
                return;
            }

            let html = `<table>
                        <thead>
                            <tr>
                                <th>姓名</th>
                                <th>單位</th>
                                <th>分機</th>
                                <th>電話</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            results.forEach(item => {
                html += `<tr>
                            <td>${item.name || ''}</td>
                            <td>${item.unit || ''}</td>
                            <td>${item.ext || ''}</td>
                            <td>${item.phone || ''}</td>
                         </tr>`;
            });
            html += `</tbody></table>`;
            resultsContainer.innerHTML = html;
        }

        // 按下 Enter 也可以搜尋
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
        
        // 點擊按鈕搜尋
        searchButton.addEventListener('click', performSearch);

    </script>
</body>
</html>
