<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電話查詢系統</title>
    <style>
        /* 確保背景填滿整個視窗 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* 預設背景樣式 (電腦版背景) */
        body {
            font-family: Arial, sans-serif;
            font-size: 18px;
            background-image: url('517.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
        }

        /* 手機版背景樣式 */
        @media (max-width: 768px) {
            body {
                background-image: url('703.jpg');
                background-attachment: scroll;
            }
        }

        .container {
            max-width: 600px;
            margin: 20px auto 0;
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 2px solid #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .search-container {
            display: flex;
            flex-direction: row;
            margin-bottom: 10px;
        }

        #searchInput {
            flex-grow: 1;
            padding: 12px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 2px;
            box-sizing: border-box;
        }

        #searchButton {
            padding: 10px 15px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }

        #searchButton:hover {
            background-color: #0056b3;
        }

        .system-remark {
            font-size: 16px;
            color: #888;
            text-align: left;
            margin-top: 15px;
            margin-bottom: -10px;
            padding: 5px;
        }

        #resultsTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border: 1px solid #ccc;
        }

        #resultsTable th, #resultsTable td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            word-break: break-word;
            font-size: 18px;
        }

        #resultsTable th {
            background-color: #f2f2f2;
            color: #333;
        }

        #resultsTable tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        #resultsTable tr:hover {
            background-color: #e9e9e9;
        }

        .loading, .error, .no-results {
            text-align: center;
            color: #777;
            margin-top: 20px;
            font-size: 18px;
            padding: 10px;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .no-results {
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>電話查詢小幫手</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="輸入關鍵字 (姓名、單位或地點)" />
            <button id="searchButton">查詢</button>
        </div>
        <p class="system-remark">此系統僅供方便查詢使用，不作即時更新連動</p>
        <div id="resultsContainer"></div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainerDiv = document.getElementById('resultsContainer');

        const scriptUrl = 'https://script.google.com/macros/s/AKfycbxIseE37yzuF1n6nmUGsmDhnpOfx49vSYeWTByW0CNlKIRik1gGLBPlf1rG21uJSWBP/exec';

        // 查詢資料
        async function performSearch() {
            const query = searchInput.value.trim();

            if (!query) {
                resultsContainerDiv.innerHTML = '<p class="no-results">請輸入查詢關鍵字。</p>';
                return;
            }

            resultsContainerDiv.innerHTML = '<p class="loading">查詢中...</p>';

            try {
                // 發送查詢請求到 Google Apps Script Web App
                const response = await fetch(`${scriptUrl}?query=${encodeURIComponent(query)}`);
                const result = await response.json();

                // 新增查詢記錄
                await logQuery(query);

                if (result.length > 0) {
                    const table = document.createElement('table');
                    table.id = 'resultsTable';

                    const thead = table.createTHead();
                    const headerRow = thead.insertRow();
                    const headers = ['姓名', '單位', '手機', '分機'];
                    headers.forEach(headerText => {
                        const th = document.createElement('th');
                        th.textContent = headerText;
                        headerRow.appendChild(th);
                    });

                    const tbody = table.createTBody();
                    result.forEach(person => {
                        const row = tbody.insertRow();
                        row.insertCell().textContent = person.name || '';
                        row.insertCell().textContent = person.department || '';
                        row.insertCell().textContent = person.mobile || '';
                        row.insertCell().textContent = person.extension || '';
                    });

                    resultsContainerDiv.innerHTML = '';
                    resultsContainerDiv.appendChild(table);
                } else {
                    resultsContainerDiv.innerHTML = '<p class="no-results">查無相關資料。</p>';
                }
            } catch (error) {
                console.error('查詢失敗:', error);
                resultsContainerDiv.innerHTML = `<p class="error">查詢失敗: ${error.message}</p>`;
            }
        }

        // 紀錄查詢關鍵字
        async function logQuery(query) {
            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'log', query })
                });

                if (!response.ok) {
                    throw new Error('新增查詢記錄失敗');
                }
            } catch (error) {
                console.error('新增查詢記錄失敗:', error);
            }
        }

        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
